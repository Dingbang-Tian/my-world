server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  config:
    # 开发环境启用 codegen 时自动加载自研 AI 框架的独立模型配置。
    import: optional:classpath:application-codegen.yml

my-world:
  ai:
    connectivity:
      enabled: ${MYWORLD_AI_CONNECTIVITY_ENABLED:true}
  codegen:
    enabled: ${MYWORLD_CODEGEN_ENABLED:true}
    web:
      owner-key: ${MYWORLD_CODEGEN_OWNER_KEY:local-dev}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.dingbang.myworld: DEBUG

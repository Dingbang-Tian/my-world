spring:
  application:
    name: my-world
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:@spring.profiles.active@}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
